---
- name: Darwin | Check macOS version (must be >= 12.0)
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution_major_version"] is defined and ansible_facts["distribution_major_version"] | int >= 12
    fail_msg: >-
      macOS {{ ansible_facts['distribution_major_version'] }}
      is not supported. Tailscale requires macOS 12.0 (Monterey) or later.

- name: Darwin | Install Tailscale via Homebrew
  community.general.homebrew:
    name: "{{ tailscale_package }}"
    state: present

